# Quality — reward durable margins, high returns on equity, and a strong balance
# sheet. No growth gate: a profitable slow-grower is a valid quality name.
# Version-controlled and immutable once used in a persisted score snapshot: changing
# weights creates a new score_version rather than altering the meaning of historical
# scores (design sections 10.4, 26).
id: quality-v1
name: Quality

universe:
  min_price: 3
  min_median_dollar_volume_20d: 10000000

hard_gates:
  # No revenue-growth gate — quality is about profitability and solvency, not growth.
  data_confidence_min: 0.80

# Factor weights sum to 1.0. Quality (margins, ROE) and balance-sheet strength lead.
weights:
  quality: 0.40
  financial_strength: 0.25
  growth: 0.15
  valuation: 0.15
  momentum: 0.05

# Penalties in score points, subtracted from the weighted factor score. Leverage is
# penalized hardest — a levered balance sheet is antithetical to the quality thesis.
penalties:
  extreme_volatility: 8
  extreme_short_term_move: 6
  leverage: 14

# Penalty trigger thresholds.
thresholds:
  extreme_volatility_20d: 0.05
  extreme_short_term_move_1d: 0.15
  leverage_debt_to_equity: 1.5

score_version: quality-v1.0.0
