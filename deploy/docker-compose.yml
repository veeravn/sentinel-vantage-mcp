# MVP single-host stack (design section 22.1). Kafka is intentionally omitted until
# replay or multi-consumer needs justify it.
#
# On `up`, the one-shot `migrate` service creates the schema and seeds the universe
# before the app services start. Bar/fundamental/event data stays manual (free-tier
# backfill is slow); run it once with the bootstrap profile:
#   docker compose -f deploy/docker-compose.yml --profile bootstrap up
name: sentinel-vantage

# Shared build/env, without lifecycle policy (used by long-running and one-shot services).
x-app-base: &app-base
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file:
    - ../.env
  environment:
    # Override localhost defaults so containers reach the compose services.
    SV_POSTGRES_DSN: postgresql://sentinel:sentinel@postgres:5432/sentinel
    SV_REDIS_URL: redis://redis:6379/0

# Long-running app services: wait for storage AND the one-shot migration to finish.
x-app: &app
  <<: *app-base
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: apply migrations and seed the reference universe, then exit. App services
  # depend on this completing successfully. Idempotent — safe to re-run on every `up`.
  migrate:
    <<: *app-base
    command: ["sh", "-c", "sv-migrate && sv-seed"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot idempotent data load, opt-in: `--profile bootstrap`. Skips when the
  # database already has bars (data persists in the pgdata volume); set
  # SV_BOOTSTRAP_FORCE=1 to reload. SEC steps are best-effort / skipped without a UA.
  bootstrap:
    <<: *app-base
    profiles: ["bootstrap"]
    command: ["sv-bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  mcp-api:
    <<: *app
    command: ["sv-mcp"]
    ports:
      # Publish the MCP port as <bind ip>:<host port>:8080.
      #  - SV_MCP_BIND: interface (default 0.0.0.0). Set to the box's tailnet IP (100.x)
      #    for plain HTTP over Tailscale — reachable only over the tailnet, no TLS needed.
      #  - SV_MCP_PUBLISH_PORT: host port (default 8080). Set to 80 for a port-less
      #    http://sentinel-vantage.ai/mcp — but port 80 must be free on that interface
      #    first (AdGuard holds 0.0.0.0:80, so rebind AdGuard to the LAN IP).
      - "${SV_MCP_BIND:-0.0.0.0}:${SV_MCP_PUBLISH_PORT:-8080}:8080"

  market-worker:
    <<: *app
    command: ["sv-worker"]

  scheduler-alerts:
    <<: *app
    command: ["sv-scheduler"]

  # Reverse proxy (opt-in: `--profile edge`). HTTPS on 443 only — port 80 is left to
  # AdGuard on this host. Fronts sentinel-vantage.ai and proxies to the MCP server.
  caddy:
    image: caddy:2
    profiles: ["edge"]
    depends_on:
      mcp-api:
        condition: service_started
    ports:
      - "443:443"
      - "443:443/udp"   # HTTP/3 (optional)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # persists the internal CA + issued certs across restarts
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
