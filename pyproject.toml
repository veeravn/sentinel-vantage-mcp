[project]
name = "sentinel-vantage-mcp"
version = "0.1.0"
description = "Sentinel Vantage — a market-intelligence MCP server for trend detection and strategy-based research ranking."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "veeravn" }]

dependencies = [
    "mcp>=2.0,<3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "asyncpg>=0.29",
    "redis>=5.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
sv-mcp = "sentinel_vantage.apps.mcp_server.__main__:main"
sv-worker = "sentinel_vantage.apps.market_worker.__main__:main"
sv-scheduler = "sentinel_vantage.apps.scheduler.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_vantage"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
